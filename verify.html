<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AgroDesign · Navegador 3D VR — Verificación de datos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="img/logo.png">
  <style>
    :root {
      --bg:#0d1a10; --panel:#12241a; --line:#243a2b; --ink:#e8efe0;
      --muted:#8fae93; --gold:#e8d9a0; --green:#6a9c4a; --bad:#e57373; --ok:#7bd88f;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.55 -apple-system, Segoe UI, Roboto, system-ui, sans-serif;
      padding:24px; min-height:100vh;
    }
    #report { max-width:980px; margin:0 auto; }
    h1 { font-size:26px; margin:0 0 2px; font-weight:600; }
    h1 .tag { font-size:13px; background:var(--green); color:#06120a; padding:2px 8px;
      border-radius:6px; vertical-align:middle; letter-spacing:.06em; }
    h2 { font-size:14px; color:var(--gold); text-transform:uppercase; letter-spacing:.05em;
      margin:22px 0 8px; font-weight:600; }
    .sub { color:var(--muted); margin:0 0 8px; }
    .muted { color:var(--muted); } .ok { color:var(--ok); } .bad { color:var(--bad); }
    a { color:var(--green); }
    code { background:#0a140d; padding:1px 6px; border-radius:5px; color:var(--gold); font-size:.9em; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
    table { width:100%; border-collapse:collapse; margin-bottom:6px; }
    th, td { text-align:left; padding:5px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; font-family:ui-monospace, monospace; }
    td.ind { padding-left:24px; color:var(--muted); }
    .hint { color:var(--muted); font-size:12px; }
    tr.ok td { color:var(--ok); } tr.bad td { color:var(--bad); }
    .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:8px; vertical-align:middle; }
    .foot { margin-top:24px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); }
    #status { position:fixed; left:12px; bottom:10px; font:12px/1.6 ui-monospace, monospace;
      color:var(--muted); background:#0a140d; padding:2px 10px; border-radius:6px; z-index:5; }
    pre { white-space:pre-wrap; background:#0a140d; padding:12px; border-radius:8px; color:var(--bad); }
  </style>
</head>
<body>
  <main id="report"><p class="sub">Cargando escenario…</p></main>
  <div id="status">cargando…</div>

  <!-- Sólo el núcleo de datos: esta página no renderiza escena -->
  <script src="vendor/three.min.js"></script>
  <script src="js/proj.js"></script>
  <script src="js/core-classify.js"></script>
  <script src="js/core-geom.js"></script>
  <script src="js/core-veg.js"></script>
  <script src="js/core-route.js"></script>
  <script src="js/data.js"></script>
  <script src="js/verify.js"></script>
</body>
</html>
