<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AgroDesign · Navegador 3D VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="vista"></canvas>

  <div id="carga">
    <div class="marca">AgroDesign · Navegador 3D <span>VR</span></div>
    <div class="txt">Iniciando…</div>
    <div class="barra"><i></i></div>
  </div>

  <div id="escenario"></div>
  <div id="hud"></div>
  <div id="ayuda">
    <kbd>click</kbd> capturar el mouse · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> moverse ·
    <kbd>Q</kbd><kbd>E</kbd> girar · <kbd>R</kbd><kbd>F</kbd> subir/bajar · <kbd>Shift</kbd> rápido<br>
    <kbd>Espacio</kbd> conmutar paisaje · <kbd>G</kbd> dron/suelo · <kbd>H</kbd> vista inicial ·
    <kbd>Esc</kbd> soltar el mouse
  </div>
  <div id="credito">Imagen satelital © Esri, Maxar, Earthstar Geographics | AgroDesign</div>
  <pre id="error"></pre>

  <!-- Orden de carga (§7): Three → proyección → núcleo → datos → escena →
       medición → rig → driver de display → orquestación.
       Scripts clásicos, sin build ni módulos ES (§2, regla 4). -->
  <script src="vendor/three.min.js"></script>
  <script src="js/proj.js"></script>
  <script src="js/core-classify.js"></script>
  <script src="js/core-geom.js"></script>
  <script src="js/core-veg.js"></script>

  <script src="js/data.js"></script>

  <script src="js/sky.js"></script>
  <script src="js/veg-scene.js"></script>
  <script src="js/perf.js"></script>
  <script src="js/rig.js"></script>
  <script src="js/display-flat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
